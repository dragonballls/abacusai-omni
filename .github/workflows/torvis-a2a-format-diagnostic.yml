name: Temporary T.O.R.V.I.S. A2A formatter diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Print exact formatter changes
        run: |
          pnpm exec oxfmt apps/desktop/src/main/services/mcp/mcp-agent-tools-server.ts apps/desktop/src/main/services/mcp/agent-tools-a2a.test.ts
          git diff -- apps/desktop/src/main/services/mcp/mcp-agent-tools-server.ts apps/desktop/src/main/services/mcp/agent-tools-a2a.test.ts
