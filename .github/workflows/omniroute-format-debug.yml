name: Temporary OmniRoute formatter diagnostic

on:
  push:
    branches:
      - fix/omniroute-startup-window-ready

permissions:
  contents: read

concurrency:
  group: omniroute-format-debug
  cancel-in-progress: true

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run formatter and print exact diff
        run: |
          cp apps/desktop/src/main/services/providers/omniroute.ts /tmp/omniroute.ts.before
          pnpm exec oxfmt apps/desktop/src/main/services/providers/omniroute.ts
          git diff --no-ext-diff --no-color -- apps/desktop/src/main/services/providers/omniroute.ts
