name: Temporary T.O.R.V.I.S. format probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Emit formatter diff
        run: |
          pnpm exec oxfmt "apps/web/src/features/bots/start/bot-start-page.tsx" "apps/web/src/routes/_shell/(bots)/bots.index.test.tsx"
          git diff -- "apps/web/src/features/bots/start/bot-start-page.tsx" "apps/web/src/routes/_shell/(bots)/bots.index.test.tsx"
