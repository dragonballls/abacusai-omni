name: Temporary OmniRoute targeted validation

on:
  push:
    branches:
      - fix/omniroute-startup-window-ready

permissions:
  contents: read

concurrency:
  group: omniroute-targeted-validation
  cancel-in-progress: true

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting of modified TypeScript files
        run: pnpm exec oxfmt --check apps/desktop/src/main/services/providers/omniroute.ts apps/desktop/src/main/services/providers/omniroute.test.ts apps/web/src/features/shell/profile-menu.test.tsx
      - name: Run OmniRoute security and startup tests
        run: pnpm --filter @abacus-ai/desktop test -- src/main/services/providers/omniroute.test.ts
      - name: Run profile-menu desktop access regression test
        run: pnpm --filter @abacus-ai/web test -- src/features/shell/profile-menu.test.tsx
