name: Temporary Vite lockfile refresh

on:
  push:
    branches:
      - feat/gods-eye-view-desktop-life360

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: contains(github.event.head_commit.message, 'Refresh Vite lockfile for security advisory')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Regenerate lockfile without running dependency lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit updated lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update lockfile for patched Vite"
          HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $HEADER" push origin "HEAD:${GITHUB_REF_NAME}"
